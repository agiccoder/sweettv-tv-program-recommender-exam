[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweettv-exam"
version = "0.1.0"
description = "Auditable SWEET.TV temporal recommendation comparison"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "scipy==1.13.1", "pandas==2.3.3", "scikit-learn==1.6.1", "pyarrow==21.0.0"]

[project.scripts]
sweettv-exam = "sweettv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
